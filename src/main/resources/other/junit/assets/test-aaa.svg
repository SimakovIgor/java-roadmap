<svg width="880" height="270" viewBox="0 0 880 270" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="aabg" x1="0" y1="0" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="aaa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="270" rx="20" fill="url(#aabg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">СТРУКТУРА ТЕСТА: ARRANGE · ACT · ASSERT</text>

  <!-- Arrange -->
  <rect x="30" y="80" width="260" height="120" rx="14" fill="#12203B" stroke="#4F8DFB"/>
  <text x="52" y="110" fill="#7FA9FB" font-size="15" font-weight="800">Arrange</text>
  <text x="52" y="130" fill="#9FB6DB" font-size="11.5">подготовка</text>
  <text x="52" y="164" fill="#C9D8F0" font-size="11.5" font-family="'JetBrains Mono',monospace">var order =</text>
  <text x="52" y="182" fill="#C9D8F0" font-size="11.5" font-family="'JetBrains Mono',monospace">  new Order(...);</text>
  <line x1="290" y1="140" x2="316" y2="140" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#aaa)"/>

  <!-- Act -->
  <rect x="318" y="80" width="244" height="120" rx="14" fill="#241C08" stroke="#FBBF24"/>
  <text x="340" y="110" fill="#F7C948" font-size="15" font-weight="800">Act</text>
  <text x="340" y="130" fill="#C9A64E" font-size="11.5">действие</text>
  <text x="340" y="164" fill="#F6EBC8" font-size="11.5" font-family="'JetBrains Mono',monospace">order.confirm();</text>
  <line x1="562" y1="140" x2="588" y2="140" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#aaa)"/>

  <!-- Assert -->
  <rect x="590" y="80" width="260" height="120" rx="14" fill="#0F3129" stroke="#34D399"/>
  <text x="612" y="110" fill="#43D9A3" font-size="15" font-weight="800">Assert</text>
  <text x="612" y="130" fill="#6FBFA6" font-size="11.5">проверка</text>
  <text x="612" y="164" fill="#E4F6EE" font-size="11.5" font-family="'JetBrains Mono',monospace">assertThat(order)</text>
  <text x="612" y="182" fill="#E4F6EE" font-size="11.5" font-family="'JetBrains Mono',monospace">  .isConfirmed();</text>

  <text x="440" y="240" fill="#8194B0" font-size="12.5" text-anchor="middle">один тест проверяет одно поведение: подготовил, вызвал, убедился в результате</text>
</svg>
