<svg width="880" height="260" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="gwbg" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="gwa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="260" rx="20" fill="url(#gwbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">ТРИ СОСТОЯНИЯ ФАЙЛА В GIT</text>

  <!-- working dir -->
  <rect x="30" y="96" width="180" height="70" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="120" y="128" fill="#EAF1FB" font-size="14" font-weight="700" text-anchor="middle">Working Dir</text>
  <text x="120" y="148" fill="#7FA9FB" font-size="11" text-anchor="middle">твои правки</text>
  <line x1="210" y1="131" x2="248" y2="131" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#gwa)"/>
  <text x="229" y="121" fill="#6FBFA6" font-size="10.5" text-anchor="middle" font-family="'JetBrains Mono',monospace">add</text>

  <!-- staging -->
  <rect x="250" y="96" width="180" height="70" rx="13" fill="#241C08" stroke="#FBBF24"/>
  <text x="340" y="128" fill="#F7C948" font-size="14" font-weight="700" text-anchor="middle">Staging</text>
  <text x="340" y="148" fill="#C9A64E" font-size="11" text-anchor="middle">готово к коммиту</text>
  <line x1="430" y1="131" x2="468" y2="131" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#gwa)"/>
  <text x="449" y="121" fill="#6FBFA6" font-size="10.5" text-anchor="middle" font-family="'JetBrains Mono',monospace">commit</text>

  <!-- local repo -->
  <rect x="470" y="96" width="180" height="70" rx="13" fill="#0F3129" stroke="#34D399"/>
  <text x="560" y="128" fill="#43D9A3" font-size="14" font-weight="700" text-anchor="middle">Local Repo</text>
  <text x="560" y="148" fill="#6FBFA6" font-size="11" text-anchor="middle">история коммитов</text>
  <line x1="650" y1="131" x2="688" y2="131" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#gwa)"/>
  <text x="669" y="121" fill="#6FBFA6" font-size="10.5" text-anchor="middle" font-family="'JetBrains Mono',monospace">push</text>

  <!-- remote -->
  <rect x="690" y="96" width="160" height="70" rx="13" fill="#161231" stroke="#A78BFA"/>
  <text x="770" y="128" fill="#B49BFB" font-size="14" font-weight="700" text-anchor="middle">Remote</text>
  <text x="770" y="148" fill="#8A7BC8" font-size="11" text-anchor="middle">GitHub / GitLab</text>

  <text x="440" y="212" fill="#8194B0" font-size="12.5" text-anchor="middle">add складывает в индекс, commit фиксирует в историю, push отправляет на сервер</text>
</svg>
