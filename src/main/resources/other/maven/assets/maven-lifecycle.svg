<svg width="880" height="240" viewBox="0 0 880 240" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="mvbg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="mva" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="240" rx="20" fill="url(#mvbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">ЖИЗНЕННЫЙ ЦИКЛ СБОРКИ MAVEN</text>

  <!-- phases -->
  <g font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">
    <rect x="28" y="92" width="120" height="52" rx="12" fill="#12203B" stroke="#4F8DFB"/><text x="88" y="123" fill="#7FA9FB" text-anchor="middle">validate</text>
    <rect x="164" y="92" width="120" height="52" rx="12" fill="#12203B" stroke="#4F8DFB"/><text x="224" y="123" fill="#7FA9FB" text-anchor="middle">compile</text>
    <rect x="300" y="92" width="120" height="52" rx="12" fill="#241C08" stroke="#FBBF24"/><text x="360" y="123" fill="#F7C948" text-anchor="middle">test</text>
    <rect x="436" y="92" width="120" height="52" rx="12" fill="#161231" stroke="#A78BFA"/><text x="496" y="123" fill="#B49BFB" text-anchor="middle">package</text>
    <rect x="572" y="92" width="120" height="52" rx="12" fill="#161231" stroke="#A78BFA"/><text x="632" y="123" fill="#B49BFB" text-anchor="middle">verify</text>
    <rect x="708" y="92" width="140" height="52" rx="12" fill="#0F3129" stroke="#34D399"/><text x="778" y="123" fill="#43D9A3" text-anchor="middle">install</text>
  </g>
  <g stroke="#5A6E8E" stroke-width="1.6">
    <line x1="148" y1="118" x2="162" y2="118" marker-end="url(#mva)"/>
    <line x1="284" y1="118" x2="298" y2="118" marker-end="url(#mva)"/>
    <line x1="420" y1="118" x2="434" y2="118" marker-end="url(#mva)"/>
    <line x1="556" y1="118" x2="570" y2="118" marker-end="url(#mva)"/>
    <line x1="692" y1="118" x2="706" y2="118" marker-end="url(#mva)"/>
  </g>

  <text x="440" y="192" fill="#8194B0" font-size="12.5" text-anchor="middle">каждая фаза запускает все предыдущие: mvn package соберёт jar, прогнав compile и test</text>
</svg>
