<svg width="880" height="290" viewBox="0 0 880 290" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="scbg" x1="0" y1="0" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="sca" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="290" rx="20" fill="url(#scbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">SPRING SECURITY: ЦЕПОЧКА ФИЛЬТРОВ</text>

  <!-- request -->
  <rect x="30" y="96" width="120" height="56" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="90" y="124" fill="#EAF1FB" font-size="13.5" font-weight="700" text-anchor="middle">HTTP-запрос</text>
  <text x="90" y="142" fill="#7FA9FB" font-size="10.5" text-anchor="middle">с токеном/сессией</text>
  <line x1="150" y1="124" x2="176" y2="124" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#sca)"/>

  <!-- filter chain -->
  <rect x="178" y="80" width="330" height="128" rx="14" fill="#0C1526" stroke="#4A3E86" stroke-dasharray="6 4"/>
  <text x="343" y="102" fill="#B49BFB" font-size="12" font-weight="700" text-anchor="middle">SecurityFilterChain</text>
  <rect x="196" y="114" width="294" height="34" rx="10" fill="#161231" stroke="#4A3E86"/>
  <text x="343" y="136" fill="#EDE9FB" font-size="12.5" text-anchor="middle">Аутентификация · кто ты?</text>
  <rect x="196" y="156" width="294" height="34" rx="10" fill="#161231" stroke="#4A3E86"/>
  <text x="343" y="178" fill="#EDE9FB" font-size="12.5" text-anchor="middle">Авторизация · что можно?</text>

  <!-- allowed -->
  <line x1="508" y1="112" x2="560" y2="112" stroke="#2C7A65" stroke-width="1.7" marker-end="url(#sca)"/>
  <text x="534" y="102" fill="#6FBFA6" font-size="10.5" text-anchor="middle">ок</text>
  <rect x="562" y="88" width="180" height="48" rx="13" fill="#0F3129" stroke="#34D399"/>
  <text x="652" y="117" fill="#5BE3AE" font-size="13.5" font-weight="700" text-anchor="middle">Controller</text>

  <!-- denied -->
  <line x1="508" y1="176" x2="560" y2="176" stroke="#8A3A4C" stroke-width="1.7" marker-end="url(#sca)"/>
  <text x="534" y="166" fill="#C87684" font-size="10.5" text-anchor="middle">нет</text>
  <rect x="562" y="152" width="180" height="48" rx="13" fill="#2A0F17" stroke="#FB7185"/>
  <text x="652" y="181" fill="#FB7185" font-size="13" font-weight="700" text-anchor="middle">401 / 403</text>

  <text x="440" y="256" fill="#8194B0" font-size="12.5" text-anchor="middle">запрос проходит фильтры до контроллера, только если аутентифицирован и имеет права</text>
</svg>
