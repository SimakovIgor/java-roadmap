<svg width="880" height="220" viewBox="0 0 880 220" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8A3A4C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="220" rx="20" fill="url(#lbg)"/>

  <!-- start -->
  <circle cx="120" cy="100" r="11" fill="#4F8DFB"/>
  <circle cx="120" cy="100" r="18" fill="none" stroke="#2E4C82"/>

  <!-- start -> in_progress -->
  <line x1="140" y1="100" x2="256" y2="100" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#ah2)"/>
  <text x="198" y="90" fill="#8FA1BF" font-size="12" text-anchor="middle">INSERT ключа</text>

  <!-- IN_PROGRESS pill -->
  <rect x="258" y="72" width="188" height="56" rx="28" fill="#241C08" stroke="#6E561A"/>
  <text x="352" y="98" fill="#F7C948" font-size="15" font-weight="700" text-anchor="middle">IN_PROGRESS</text>
  <text x="352" y="115" fill="#C9A64E" font-size="11" text-anchor="middle">ключ захвачен</text>

  <!-- in_progress -> completed -->
  <line x1="446" y1="100" x2="574" y2="100" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#ah2)"/>
  <text x="510" y="90" fill="#8FA1BF" font-size="12" text-anchor="middle">успех</text>

  <!-- COMPLETED pill -->
  <rect x="576" y="72" width="188" height="56" rx="28" fill="#123D33" stroke="#1E5C4C"/>
  <text x="670" y="98" fill="#5BE3AE" font-size="15" font-weight="700" text-anchor="middle">COMPLETED</text>
  <text x="670" y="115" fill="#6FBFA6" font-size="11" text-anchor="middle">ответ сохранён</text>

  <!-- completed self-loop: replay -->
  <path d="M700 72 C 712 44, 748 44, 760 72" stroke="#2C7A65" stroke-width="1.6" fill="none" marker-end="url(#ah2)"/>
  <text x="742" y="38" fill="#6FBFA6" font-size="11.5" text-anchor="middle">повтор → сохранённый ответ</text>

  <!-- in_progress -> removed (failure) -->
  <line x1="352" y1="128" x2="352" y2="160" stroke="#8A3A4C" stroke-width="1.6" marker-end="url(#ahR)"/>
  <text x="366" y="150" fill="#C87684" font-size="11.5" text-anchor="start">ошибка / таймаут</text>

  <!-- removed node -->
  <rect x="258" y="162" width="188" height="42" rx="12" fill="#2A0F17" stroke="#6E2C3B"/>
  <text x="352" y="182" fill="#FB7185" font-size="13.5" font-weight="700" text-anchor="middle">Запись удалена</text>
  <text x="352" y="197" fill="#9A5563" font-size="10.5" text-anchor="middle">клиент ретраит с нуля</text>
</svg>
