<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="obbg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="oba" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="20" fill="url(#obbg)"/>

  <!-- createOrder -->
  <rect x="24" y="108" width="132" height="60" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="90" y="143" fill="#EAF1FB" font-size="14" font-weight="700" text-anchor="middle">createOrder()</text>
  <line x1="156" y1="138" x2="180" y2="138" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#oba)"/>

  <!-- transaction box -->
  <rect x="182" y="52" width="204" height="178" rx="14" fill="#0C1526" stroke="#3A4B6B" stroke-dasharray="6 4"/>
  <text x="284" y="44" fill="#8FA1BF" font-size="11.5" font-weight="700" letter-spacing="1" text-anchor="middle">ОДНА ТРАНЗАКЦИЯ · PostgreSQL</text>
  <rect x="202" y="72" width="164" height="46" rx="11" fill="#123D33" stroke="#34D399"/>
  <text x="284" y="100" fill="#5BE3AE" font-size="13.5" font-weight="700" text-anchor="middle">INSERT orders</text>
  <text x="284" y="140" fill="#7C8FB0" font-size="16" font-weight="800" text-anchor="middle">+</text>
  <rect x="202" y="152" width="164" height="46" rx="11" fill="#241C08" stroke="#FBBF24"/>
  <text x="284" y="180" fill="#F7C948" font-size="13.5" font-weight="700" text-anchor="middle">INSERT outbox · NEW</text>
  <text x="284" y="222" fill="#8194B0" font-size="11" text-anchor="middle">один коммит, либо оба, либо ничего</text>

  <!-- tx -> poller -->
  <line x1="386" y1="175" x2="424" y2="150" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#oba)"/>

  <!-- poller -->
  <rect x="426" y="108" width="150" height="60" rx="13" fill="#161B2E" stroke="#3A4B6B"/>
  <text x="501" y="134" fill="#DCE6F5" font-size="13.5" font-weight="700" text-anchor="middle">Poller @Scheduled</text>
  <text x="501" y="153" fill="#8FA1BF" font-size="10.5" text-anchor="middle">FOR UPDATE SKIP LOCKED</text>
  <line x1="576" y1="138" x2="600" y2="138" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#oba)"/>

  <!-- kafka -->
  <rect x="602" y="108" width="120" height="60" rx="13" fill="#161231" stroke="#4A3E86"/>
  <text x="662" y="134" fill="#B49BFB" font-size="14" font-weight="700" text-anchor="middle">Kafka</text>
  <text x="662" y="153" fill="#8A7BC8" font-size="10.5" text-anchor="middle">payment-events</text>
  <line x1="722" y1="138" x2="746" y2="138" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#oba)"/>

  <!-- consumers -->
  <rect x="748" y="100" width="118" height="76" rx="13" fill="#0F3129" stroke="#1E5C4C"/>
  <text x="807" y="128" fill="#43D9A3" font-size="13" font-weight="700" text-anchor="middle">консьюмеры</text>
  <text x="807" y="148" fill="#6FBFA6" font-size="10.5" text-anchor="middle">идемпотентные</text>
  <text x="807" y="164" fill="#6FBFA6" font-size="10.5" text-anchor="middle">склад · баллы · чек</text>

  <!-- caption -->
  <text x="440" y="278" fill="#8194B0" font-size="12" text-anchor="middle">поллер публикует и помечает запись SENT · at-least-once, дубли гасит идемпотентный консьюмер</text>
</svg>
