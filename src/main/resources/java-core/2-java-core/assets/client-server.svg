<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="csbg2" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="csm" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="280" rx="20" fill="url(#csbg2)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">КЛИЕНТ И СЕРВЕР ЧЕРЕЗ СОКЕТ (TCP)</text>

  <!-- client -->
  <rect x="40" y="90" width="230" height="110" rx="14" fill="#12203B" stroke="#4F8DFB"/>
  <text x="155" y="122" fill="#7FA9FB" font-size="16" font-weight="800" text-anchor="middle">Клиент</text>
  <line x1="40" y1="136" x2="270" y2="136" stroke="#2E4C82"/>
  <text x="62" y="162" fill="#C9D8F0" font-size="12" font-family="'JetBrains Mono',monospace">new Socket(host, port)</text>
  <text x="62" y="184" fill="#9FB6DB" font-size="12" font-family="'JetBrains Mono',monospace">in / out streams</text>

  <!-- server -->
  <rect x="610" y="90" width="230" height="110" rx="14" fill="#0F3129" stroke="#34D399"/>
  <text x="725" y="122" fill="#43D9A3" font-size="16" font-weight="800" text-anchor="middle">Сервер</text>
  <line x1="610" y1="136" x2="840" y2="136" stroke="#1E5C4C"/>
  <text x="632" y="162" fill="#E4F6EE" font-size="12" font-family="'JetBrains Mono',monospace">new ServerSocket(port)</text>
  <text x="632" y="184" fill="#6FBFA6" font-size="12" font-family="'JetBrains Mono',monospace">accept()</text>

  <!-- request -->
  <line x1="270" y1="128" x2="608" y2="128" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#csm)"/>
  <text x="440" y="118" fill="#8FA1BF" font-size="12.5" text-anchor="middle">запрос →</text>
  <!-- response -->
  <line x1="610" y1="166" x2="272" y2="166" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#csm)"/>
  <text x="440" y="186" fill="#8FA1BF" font-size="12.5" text-anchor="middle">← ответ</text>

  <text x="440" y="238" fill="#64758F" font-size="12" text-anchor="middle">сервер слушает порт и на accept() отдаёт Socket для общения с клиентом</text>
</svg>
