<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="gtbg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="20" fill="url(#gtbg)"/>

  <!-- Left: raw List -->
  <rect x="20" y="20" width="416" height="260" rx="16" fill="#0C1526" stroke="#213551"/>
  <circle cx="46" cy="52" r="7" fill="#FB7185"/>
  <text x="62" y="57" fill="#F1F5FB" font-size="14.5" font-weight="700">Без generics · raw List</text>
  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12.5">
    <text x="44" y="98" fill="#9FB6DB">List list = new ArrayList();</text>
    <text x="44" y="122" fill="#9FB6DB">list.add("a");</text>
    <text x="44" y="146" fill="#C9D8F0">list.add(42);   </text><text x="220" y="146" fill="#6FBFA6">// компилятор молчит</text>
    <text x="44" y="182" fill="#F7C948">String s = (String) list.get(1);</text>
  </g>
  <rect x="44" y="204" width="368" height="46" rx="12" fill="#2A0F17" stroke="#FB7185"/>
  <text x="228" y="232" fill="#FB7185" font-size="13" font-weight="700" text-anchor="middle">💥 ClassCastException в рантайме</text>

  <!-- Right: List<String> -->
  <rect x="444" y="20" width="416" height="260" rx="16" fill="#0C1526" stroke="#213551"/>
  <circle cx="470" cy="52" r="7" fill="#34D399"/>
  <text x="486" y="57" fill="#F1F5FB" font-size="14.5" font-weight="700">С generics · List&lt;String&gt;</text>
  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12.5">
    <text x="468" y="98" fill="#9FB6DB">List&lt;String&gt; list = new ArrayList&lt;&gt;();</text>
    <text x="468" y="122" fill="#9FB6DB">list.add("a");</text>
    <text x="468" y="146" fill="#FB7185">list.add(42);   </text><text x="644" y="146" fill="#C87684">// не скомпилируется</text>
    <text x="468" y="182" fill="#43D9A3">String s = list.get(1);   </text><text x="700" y="182" fill="#6FBFA6">// без каста</text>
  </g>
  <rect x="468" y="204" width="368" height="46" rx="12" fill="#123D33" stroke="#34D399"/>
  <text x="652" y="232" fill="#5BE3AE" font-size="13" font-weight="700" text-anchor="middle">✓ ошибка ловится на компиляции</text>
</svg>
