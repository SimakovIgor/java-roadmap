<svg width="880" height="320" viewBox="0 0 880 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="icbg" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="ica" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto">
      <path d="M3 3 L11 7 L3 11 Z" fill="#0C1730" stroke="#A78BFA" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" rx="20" fill="url(#icbg)"/>

  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">ИНТЕРФЕЙС = КОНТРАКТ</text>
  <text x="40" y="60" fill="#64758F" font-size="12">интерфейс описывает «что уметь», классы реализуют «как именно»</text>

  <!-- implements arrows (dashed) -->
  <path d="M200 214 C 220 172 320 154 384 150" stroke="#4A3E86" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ica)"/>
  <path d="M440 214 V 152" stroke="#4A3E86" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ica)"/>
  <path d="M680 214 C 660 172 560 154 496 150" stroke="#4A3E86" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ica)"/>
  <text x="266" y="188" fill="#A78BFA" font-size="11" font-family="'JetBrains Mono',monospace">implements</text>
  <text x="588" y="188" fill="#A78BFA" font-size="11" font-family="'JetBrains Mono',monospace">implements</text>

  <!-- interface -->
  <rect x="330" y="76" width="220" height="76" rx="14" fill="#161231" stroke="#A78BFA"/>
  <text x="440" y="98" fill="#8A7BC8" font-size="11" text-anchor="middle" font-style="italic">«interface»</text>
  <text x="440" y="118" fill="#EDE9FB" font-size="15" font-weight="800" text-anchor="middle">Payable</text>
  <line x1="330" y1="128" x2="550" y2="128" stroke="#4A3E86"/>
  <text x="352" y="146" fill="#EDE9FB" font-size="12.5" font-family="'JetBrains Mono',monospace">pay(amount)</text>

  <!-- impl Card -->
  <rect x="90" y="214" width="220" height="86" rx="14" fill="#0F3129" stroke="#34D399"/>
  <text x="200" y="242" fill="#5BE3AE" font-size="15" font-weight="800" text-anchor="middle">Card</text>
  <line x1="90" y1="254" x2="310" y2="254" stroke="#1E5C4C"/>
  <text x="112" y="280" fill="#E4F6EE" font-size="12" font-family="'JetBrains Mono',monospace">pay()</text>
  <text x="180" y="280" fill="#6FBFA6" font-size="11" font-family="'JetBrains Mono',monospace">→ эквайринг</text>

  <!-- impl Cash -->
  <rect x="330" y="214" width="220" height="86" rx="14" fill="#12203B" stroke="#4F8DFB"/>
  <text x="440" y="242" fill="#7FA9FB" font-size="15" font-weight="800" text-anchor="middle">Cash</text>
  <line x1="330" y1="254" x2="550" y2="254" stroke="#2E4C82"/>
  <text x="352" y="280" fill="#EAF1FB" font-size="12" font-family="'JetBrains Mono',monospace">pay()</text>
  <text x="420" y="280" fill="#9FB6DB" font-size="11" font-family="'JetBrains Mono',monospace">→ наличными</text>

  <!-- impl Crypto -->
  <rect x="570" y="214" width="220" height="86" rx="14" fill="#241C08" stroke="#FBBF24"/>
  <text x="680" y="242" fill="#F7C948" font-size="15" font-weight="800" text-anchor="middle">Crypto</text>
  <line x1="570" y1="254" x2="790" y2="254" stroke="#6E561A"/>
  <text x="592" y="280" fill="#F6EBC8" font-size="12" font-family="'JetBrains Mono',monospace">pay()</text>
  <text x="660" y="280" fill="#C9A64E" font-size="11" font-family="'JetBrains Mono',monospace">→ кошелёк</text>
</svg>
