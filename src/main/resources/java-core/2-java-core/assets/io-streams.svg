<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="iobg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="20" fill="url(#iobg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">ДВА СЕМЕЙСТВА ПОТОКОВ</text>

  <!-- byte streams -->
  <rect x="20" y="58" width="416" height="222" rx="16" fill="#0C1526" stroke="#213551"/>
  <circle cx="46" cy="90" r="7" fill="#4F8DFB"/>
  <text x="62" y="95" fill="#F1F5FB" font-size="14.5" font-weight="700">Байтовые · сырые данные</text>
  <text x="48" y="120" fill="#64758F" font-size="12">картинки, архивы, сеть, любые байты</text>
  <rect x="48" y="140" width="176" height="50" rx="12" fill="#12203B" stroke="#4F8DFB"/>
  <text x="136" y="163" fill="#7FA9FB" font-size="13.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">InputStream</text>
  <text x="136" y="181" fill="#9FB6DB" font-size="10.5" text-anchor="middle">чтение</text>
  <rect x="232" y="140" width="176" height="50" rx="12" fill="#12203B" stroke="#4F8DFB"/>
  <text x="320" y="163" fill="#7FA9FB" font-size="13.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">OutputStream</text>
  <text x="320" y="181" fill="#9FB6DB" font-size="10.5" text-anchor="middle">запись</text>
  <text x="228" y="230" fill="#8194B0" font-size="11.5" text-anchor="middle">оперируют байтами (int / byte[])</text>
  <text x="228" y="256" fill="#6FBFA6" font-size="11.5" text-anchor="middle">оборачивай в Buffered… для скорости</text>

  <!-- char streams -->
  <rect x="444" y="58" width="416" height="222" rx="16" fill="#0C1526" stroke="#213551"/>
  <circle cx="470" cy="90" r="7" fill="#34D399"/>
  <text x="486" y="95" fill="#F1F5FB" font-size="14.5" font-weight="700">Символьные · текст</text>
  <text x="472" y="120" fill="#64758F" font-size="12">строки с учётом кодировки (UTF-8)</text>
  <rect x="472" y="140" width="176" height="50" rx="12" fill="#0F3129" stroke="#34D399"/>
  <text x="560" y="163" fill="#43D9A3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">Reader</text>
  <text x="560" y="181" fill="#6FBFA6" font-size="10.5" text-anchor="middle">чтение</text>
  <rect x="656" y="140" width="176" height="50" rx="12" fill="#0F3129" stroke="#34D399"/>
  <text x="744" y="163" fill="#43D9A3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">Writer</text>
  <text x="744" y="181" fill="#6FBFA6" font-size="10.5" text-anchor="middle">запись</text>
  <text x="652" y="230" fill="#8194B0" font-size="11.5" text-anchor="middle">оперируют символами (char / String)</text>
  <text x="652" y="256" fill="#6FBFA6" font-size="11.5" text-anchor="middle">для текста бери именно эти</text>
</svg>
