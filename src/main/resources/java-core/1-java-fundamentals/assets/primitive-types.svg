<svg width="900" height="290" viewBox="0 0 900 290" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="ptbg" x1="0" y1="0" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="290" rx="20" fill="url(#ptbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">8 ПРИМИТИВНЫХ ТИПОВ</text>

  <!-- целые -->
  <text x="40" y="72" fill="#7FA9FB" font-size="12.5" font-weight="700">ЦЕЛЫЕ ЧИСЛА</text>
  <g font-family="'JetBrains Mono',monospace">
    <rect x="40" y="84" width="132" height="66" rx="12" fill="#12203B" stroke="#2E4C82"/>
    <text x="106" y="114" fill="#EAF1FB" font-size="16" font-weight="700" text-anchor="middle">byte</text>
    <text x="106" y="134" fill="#7FA9FB" font-size="11" text-anchor="middle" font-family="Inter">8 бит</text>
    <rect x="182" y="84" width="132" height="66" rx="12" fill="#12203B" stroke="#2E4C82"/>
    <text x="248" y="114" fill="#EAF1FB" font-size="16" font-weight="700" text-anchor="middle">short</text>
    <text x="248" y="134" fill="#7FA9FB" font-size="11" text-anchor="middle" font-family="Inter">16 бит</text>
    <rect x="324" y="84" width="132" height="66" rx="12" fill="#152A4D" stroke="#4F8DFB" stroke-width="2"/>
    <text x="390" y="114" fill="#BFD6FF" font-size="16" font-weight="800" text-anchor="middle">int</text>
    <text x="390" y="134" fill="#7FA9FB" font-size="11" text-anchor="middle" font-family="Inter">32 бита · по умолчанию</text>
    <rect x="466" y="84" width="132" height="66" rx="12" fill="#12203B" stroke="#2E4C82"/>
    <text x="532" y="114" fill="#EAF1FB" font-size="16" font-weight="700" text-anchor="middle">long</text>
    <text x="532" y="134" fill="#7FA9FB" font-size="11" text-anchor="middle" font-family="Inter">64 бита · 100L</text>
  </g>

  <!-- дробные -->
  <text x="40" y="182" fill="#43D9A3" font-size="12.5" font-weight="700">ДРОБНЫЕ</text>
  <g font-family="'JetBrains Mono',monospace">
    <rect x="40" y="194" width="132" height="66" rx="12" fill="#0F3129" stroke="#2C7A65"/>
    <text x="106" y="224" fill="#E4F6EE" font-size="16" font-weight="700" text-anchor="middle">float</text>
    <text x="106" y="244" fill="#6FBFA6" font-size="11" text-anchor="middle" font-family="Inter">32 бита · 1.5f</text>
    <rect x="182" y="194" width="132" height="66" rx="12" fill="#123A30" stroke="#34D399" stroke-width="2"/>
    <text x="248" y="224" fill="#8FF0CC" font-size="16" font-weight="800" text-anchor="middle">double</text>
    <text x="248" y="244" fill="#6FBFA6" font-size="11" text-anchor="middle" font-family="Inter">64 бита · по умолчанию</text>
  </g>

  <!-- символ -->
  <text x="360" y="182" fill="#B49BFB" font-size="12.5" font-weight="700">СИМВОЛ</text>
  <g font-family="'JetBrains Mono',monospace">
    <rect x="360" y="194" width="132" height="66" rx="12" fill="#161231" stroke="#4A3E86"/>
    <text x="426" y="224" fill="#EDE9FB" font-size="16" font-weight="700" text-anchor="middle">char</text>
    <text x="426" y="244" fill="#B49BFB" font-size="11" text-anchor="middle" font-family="Inter">16 бит · 'A'</text>
  </g>

  <!-- логический -->
  <text x="516" y="182" fill="#F7C948" font-size="12.5" font-weight="700">ЛОГИЧЕСКИЙ</text>
  <g font-family="'JetBrains Mono',monospace">
    <rect x="516" y="194" width="132" height="66" rx="12" fill="#241C08" stroke="#7A5E1E"/>
    <text x="582" y="224" fill="#F6EBC8" font-size="15" font-weight="700" text-anchor="middle">boolean</text>
    <text x="582" y="244" fill="#C9A64E" font-size="11" text-anchor="middle" font-family="Inter">true / false</text>
  </g>

  <!-- side note -->
  <rect x="668" y="84" width="196" height="176" rx="14" fill="#0C1526" stroke="#22345C"/>
  <text x="686" y="112" fill="#AFC0DD" font-size="12.5" font-weight="700">Как выбрать</text>
  <text x="686" y="138" fill="#8FA6C8" font-size="11.5">целое → int</text>
  <text x="686" y="160" fill="#8FA6C8" font-size="11.5">дробное → double</text>
  <text x="686" y="182" fill="#8FA6C8" font-size="11.5">да/нет → boolean</text>
  <text x="686" y="204" fill="#8FA6C8" font-size="11.5">символ → char</text>
  <text x="686" y="232" fill="#6E82A6" font-size="10.5">остальные нужны редко,</text>
  <text x="686" y="248" fill="#6E82A6" font-size="10.5">под экономию памяти</text>
</svg>
