<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="sibg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="sia" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="20" fill="url(#sibg)"/>

  <!-- ===== Left: String immutable ===== -->
  <rect x="20" y="20" width="416" height="260" rx="16" fill="#0C1526" stroke="#213551"/>
  <circle cx="46" cy="52" r="7" fill="#FB7185"/>
  <text x="62" y="57" fill="#F1F5FB" font-size="14.5" font-weight="700">String · неизменяемый</text>
  <text x="48" y="86" fill="#C87684" font-size="12.5" font-family="'JetBrains Mono',monospace">s = "a"; s += "b"; s += "c";</text>

  <!-- three objects: two garbage, one current -->
  <rect x="48" y="118" width="96" height="52" rx="12" fill="#1A1114" stroke="#4A2A32"/>
  <text x="96" y="149" fill="#8A6068" font-size="15" font-weight="700" text-anchor="middle">"a"</text>
  <line x1="144" y1="144" x2="176" y2="144" stroke="#8A3A4C" stroke-width="1.5" marker-end="url(#sia)"/>
  <text x="160" y="135" fill="#C87684" font-size="10.5" text-anchor="middle">+b</text>

  <rect x="178" y="118" width="96" height="52" rx="12" fill="#1A1114" stroke="#4A2A32"/>
  <text x="226" y="149" fill="#8A6068" font-size="15" font-weight="700" text-anchor="middle">"ab"</text>
  <line x1="274" y1="144" x2="306" y2="144" stroke="#8A3A4C" stroke-width="1.5" marker-end="url(#sia)"/>
  <text x="290" y="135" fill="#C87684" font-size="10.5" text-anchor="middle">+c</text>

  <rect x="308" y="116" width="104" height="56" rx="12" fill="#2A0F17" stroke="#FB7185"/>
  <text x="360" y="149" fill="#FB7185" font-size="15" font-weight="800" text-anchor="middle">"abc"</text>

  <text x="96" y="196" fill="#7C5058" font-size="10.5" text-anchor="middle">мусор</text>
  <text x="226" y="196" fill="#7C5058" font-size="10.5" text-anchor="middle">мусор</text>
  <text x="228" y="256" fill="#8194B0" font-size="12" text-anchor="middle">каждый += создаёт новый объект</text>

  <!-- ===== Right: StringBuilder mutable ===== -->
  <rect x="444" y="20" width="416" height="260" rx="16" fill="#0C1526" stroke="#213551"/>
  <circle cx="470" cy="52" r="7" fill="#34D399"/>
  <text x="486" y="57" fill="#F1F5FB" font-size="14.5" font-weight="700">StringBuilder · изменяемый</text>
  <text x="472" y="86" fill="#6FBFA6" font-size="12.5" font-family="'JetBrains Mono',monospace">sb.append("b").append("c");</text>

  <!-- one object, mutated in place -->
  <rect x="600" y="120" width="130" height="60" rx="13" fill="#123D33" stroke="#34D399"/>
  <text x="665" y="156" fill="#5BE3AE" font-size="16" font-weight="800" text-anchor="middle">"abc"</text>

  <!-- append loops -->
  <path d="M600 140 C 540 120 540 96 610 100" stroke="#2C7A65" stroke-width="1.5" fill="none" marker-end="url(#sia)"/>
  <text x="548" y="94" fill="#6FBFA6" font-size="10.5">append</text>
  <path d="M730 160 C 790 180 790 204 720 200" stroke="#2C7A65" stroke-width="1.5" fill="none" marker-end="url(#sia)"/>
  <text x="782" y="206" fill="#6FBFA6" font-size="10.5">append</text>

  <text x="652" y="256" fill="#8194B0" font-size="12" text-anchor="middle">один объект меняется на месте</text>
</svg>
