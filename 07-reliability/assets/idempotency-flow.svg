<svg width="880" height="424" viewBox="0 0 880 424" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="424" rx="20" fill="url(#fbg)"/>

  <!-- entry -->
  <rect x="330" y="22" width="220" height="50" rx="14" fill="#12203B" stroke="#2E4C82"/>
  <text x="440" y="46" fill="#EAF1FB" font-size="14" font-weight="700" text-anchor="middle">POST /pay</text>
  <text x="440" y="63" fill="#7FA9FB" font-size="11.5" text-anchor="middle">Idempotency-Key: abc-123</text>

  <line x1="440" y1="72" x2="440" y2="94" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- decision -->
  <rect x="300" y="98" width="280" height="50" rx="14" fill="#161B2E" stroke="#3A4B6B"/>
  <text x="440" y="128" fill="#DCE6F5" font-size="14.5" font-weight="700" text-anchor="middle">Ключ уже в дедуп-таблице?</text>

  <!-- branches -->
  <path d="M330 140 C 200 156, 150 160, 150 182" stroke="#2C7A65" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M440 148 L440 182" stroke="#8A6D28" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M550 140 C 690 156, 730 160, 730 182" stroke="#8A3A4C" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <!-- ===== Lane A · emerald · new key ===== -->
  <rect x="40" y="184" width="220" height="28" rx="14" fill="#0F3129" stroke="#1E5C4C"/>
  <text x="150" y="203" fill="#43D9A3" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">НОВЫЙ КЛЮЧ · INSERT</text>

  <rect x="40" y="226" width="220" height="52" rx="13" fill="#0B2117" stroke="#1E5C4C"/>
  <text x="60" y="249" fill="#E4F6EE" font-size="14" font-weight="600">charge()</text>
  <text x="60" y="267" fill="#6FBFA6" font-size="11.5">реальное движение денег</text>
  <line x1="150" y1="278" x2="150" y2="296" stroke="#2C7A65" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="40" y="298" width="220" height="52" rx="13" fill="#0B2117" stroke="#1E5C4C"/>
  <text x="60" y="321" fill="#E4F6EE" font-size="14" font-weight="600">Сохранить результат</text>
  <text x="60" y="339" fill="#6FBFA6" font-size="11.5">под ключом в БД</text>
  <line x1="150" y1="350" x2="150" y2="368" stroke="#2C7A65" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="40" y="370" width="220" height="40" rx="13" fill="#123D33" stroke="#34D399"/>
  <text x="150" y="395" fill="#5BE3AE" font-size="14" font-weight="700" text-anchor="middle">200 · ответ</text>

  <!-- ===== Lane B · amber · completed ===== -->
  <rect x="330" y="184" width="220" height="28" rx="14" fill="#3A2E0C" stroke="#6E561A"/>
  <text x="440" y="203" fill="#F7C948" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">COMPLETED</text>

  <rect x="330" y="226" width="220" height="52" rx="13" fill="#241C08" stroke="#6E561A"/>
  <text x="350" y="249" fill="#F6EBC8" font-size="14" font-weight="600">Вернуть сохранённый</text>
  <text x="350" y="267" fill="#C9A64E" font-size="11.5">ответ первого вызова</text>
  <line x1="440" y1="278" x2="440" y2="296" stroke="#8A6D28" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="330" y="298" width="220" height="40" rx="13" fill="#3A2E0C" stroke="#FBBF24"/>
  <text x="440" y="323" fill="#F7C948" font-size="14" font-weight="700" text-anchor="middle">200 · тот же ответ</text>

  <text x="440" y="366" fill="#8A7A46" font-size="12" text-anchor="middle" font-style="italic">charge() НЕ вызывается</text>

  <!-- ===== Lane C · rose · in progress ===== -->
  <rect x="620" y="184" width="220" height="28" rx="14" fill="#3A1620" stroke="#6E2C3B"/>
  <text x="730" y="203" fill="#FB7185" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">IN_PROGRESS</text>

  <rect x="620" y="226" width="220" height="52" rx="13" fill="#2A0F17" stroke="#6E2C3B"/>
  <text x="640" y="249" fill="#F7D6DC" font-size="14" font-weight="600">Параллельный дубль</text>
  <text x="640" y="267" fill="#C87684" font-size="11.5">операция ещё идёт</text>
  <line x1="730" y1="278" x2="730" y2="296" stroke="#8A3A4C" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="620" y="298" width="220" height="40" rx="13" fill="#3A1620" stroke="#FB7185"/>
  <text x="730" y="323" fill="#FB7185" font-size="14" font-weight="700" text-anchor="middle">409 · Conflict</text>

  <text x="730" y="366" fill="#9A5563" font-size="12" text-anchor="middle" font-style="italic">клиент ретрайнет позже</text>
