<svg width="880" height="340" viewBox="0 0 880 340" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="ddbg" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="dda" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="340" rx="20" fill="url(#ddbg)"/>

  <text x="40" y="44" fill="#8FA1BF" font-size="12" font-weight="700" letter-spacing="1.5">AT-LEAST-ONCE · ОДНО СОБЫТИЕ ПРИШЛО ДВАЖДЫ</text>

  <!-- message copies -->
  <rect x="40" y="66" width="200" height="52" rx="12" fill="#12203B" stroke="#2E4C82"/>
  <text x="60" y="90" fill="#EAF1FB" font-size="14" font-weight="700">payment #42</text>
  <text x="60" y="108" fill="#7FA9FB" font-size="11">1-я доставка</text>

  <rect x="40" y="150" width="200" height="52" rx="12" fill="#0E1B33" stroke="#2E4C82" stroke-dasharray="5 4"/>
  <text x="60" y="174" fill="#C9D8F0" font-size="14" font-weight="700">payment #42</text>
  <text x="60" y="192" fill="#7FA9FB" font-size="11">2-я доставка · дубль</text>

  <!-- arrows to gate -->
  <line x1="240" y1="92" x2="286" y2="128" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#dda)"/>
  <line x1="240" y1="176" x2="286" y2="162" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#dda)"/>

  <!-- gate -->
  <rect x="290" y="96" width="250" height="96" rx="14" fill="#161B2E" stroke="#3A4B6B"/>
  <text x="415" y="138" fill="#DCE6F5" font-size="14" font-weight="700" text-anchor="middle">INSERT idempotency key</text>
  <text x="415" y="160" fill="#8FA1BF" font-size="12" text-anchor="middle">ON CONFLICT DO NOTHING</text>

  <!-- gate -> new key (green) -->
  <path d="M540 122 C 566 102 586 96 606 96" stroke="#5A6E8E" stroke-width="1.6" fill="none" marker-end="url(#dda)"/>
  <text x="572" y="92" fill="#6FBFA6" font-size="11.5" text-anchor="middle">новый</text>
  <rect x="608" y="72" width="232" height="72" rx="13" fill="#123D33" stroke="#34D399"/>
  <text x="724" y="103" fill="#5BE3AE" font-size="13.5" font-weight="700" text-anchor="middle">эффект + ключ</text>
  <text x="724" y="124" fill="#6FBFA6" font-size="11.5" text-anchor="middle">в одной транзакции</text>

  <!-- gate -> conflict (amber) -->
  <path d="M540 166 C 566 188 586 196 606 200" stroke="#5A6E8E" stroke-width="1.6" fill="none" marker-end="url(#dda)"/>
  <text x="572" y="192" fill="#C9A64E" font-size="11.5" text-anchor="middle">дубль</text>
  <rect x="608" y="176" width="232" height="56" rx="13" fill="#241C08" stroke="#FBBF24"/>
  <text x="724" y="209" fill="#F7C948" font-size="13.5" font-weight="700" text-anchor="middle">пропустить · только ack</text>

  <!-- result caption -->
  <rect x="290" y="266" width="300" height="44" rx="13" fill="#0F3129" stroke="#1E5C4C"/>
  <text x="440" y="293" fill="#43D9A3" font-size="13.5" font-weight="700" text-anchor="middle">эффект случается ровно один раз</text>
  <line x1="724" y1="144" x2="724" y2="176" stroke="#2C7A65" stroke-width="1.4" stroke-dasharray="4 3"/>
</svg>
