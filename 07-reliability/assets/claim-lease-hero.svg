<svg width="880" height="230" viewBox="0 0 880 230" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="clbg" x1="0" y1="0" x2="880" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#0F2233"/>
    </linearGradient>
    <radialGradient id="clglow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 10) rotate(115) scale(280)">
      <stop stop-color="#34D399" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clpanel"><rect x="2" y="2" width="876" height="226" rx="22"/></clipPath>
  </defs>

  <rect x="2" y="2" width="876" height="226" rx="22" fill="url(#clbg)" stroke="#213F3B"/>
  <g clip-path="url(#clpanel)">
    <rect x="2" y="2" width="876" height="226" fill="url(#clglow)"/>
    <g opacity="0.05" stroke="#ffffff"><path d="M2 60 H878 M2 118 H878 M2 176 H878"/></g>
  </g>

  <!-- eyebrow -->
  <text x="44" y="54" fill="#5E9A83" font-size="12.5" font-weight="700" letter-spacing="3">ПРИЁМ 14 · НАДЁЖНАЯ ДОСТАВКА</text>
  <!-- title -->
  <text x="43" y="102" fill="#F8FAFC" font-size="36" font-weight="800">Claim и lease</text>
  <!-- subtitle -->
  <text x="44" y="138" fill="#B7C4DB" font-size="16">Несколько воркеров разбирают таблицу задач без долгих локов</text>

  <!-- pills -->
  <g font-size="12.5" font-weight="600">
    <rect x="44" y="172" width="140" height="30" rx="15" fill="#0F3129" stroke="#1E5C4C"/>
    <text x="114" y="192" fill="#43D9A3" text-anchor="middle">SKIP LOCKED</text>
    <rect x="194" y="172" width="168" height="30" rx="15" fill="#0F3129" stroke="#1E5C4C"/>
    <text x="278" y="192" fill="#43D9A3" text-anchor="middle">lease по времени</text>
  </g>

  <!-- emblem: mini task table (some rows claimed) -->
  <g>
    <rect x="672" y="50" width="156" height="130" rx="16" fill="#0E1A2E" stroke="#24403A"/>
    <!-- claimed rows -->
    <rect x="688" y="66" width="124" height="22" rx="7" fill="#123D33" stroke="#34D399"/>
    <circle cx="701" cy="77" r="3.5" fill="#34D399"/>
    <rect x="712" y="72" width="60" height="4" rx="2" fill="#2C7A65"/>
    <text x="800" y="81" fill="#34D399" font-size="9" font-weight="700" text-anchor="end">🔒</text>

    <rect x="688" y="94" width="124" height="22" rx="7" fill="#123D33" stroke="#34D399"/>
    <circle cx="701" cy="105" r="3.5" fill="#34D399"/>
    <rect x="712" y="100" width="48" height="4" rx="2" fill="#2C7A65"/>
    <text x="800" y="109" fill="#34D399" font-size="9" font-weight="700" text-anchor="end">🔒</text>

    <!-- free rows -->
    <rect x="688" y="122" width="124" height="22" rx="7" fill="#0C1526" stroke="#26324B"/>
    <circle cx="701" cy="133" r="3.5" fill="#4A5B78"/>
    <rect x="712" y="128" width="66" height="4" rx="2" fill="#2A3B57"/>

    <rect x="688" y="150" width="124" height="22" rx="7" fill="#0C1526" stroke="#26324B"/>
    <circle cx="701" cy="161" r="3.5" fill="#4A5B78"/>
    <rect x="712" y="156" width="40" height="4" rx="2" fill="#2A3B57"/>
  </g>
</svg>
