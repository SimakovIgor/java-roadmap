<svg width="880" height="330" viewBox="0 0 880 330" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="csbg" x1="0" y1="0" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="csErr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M1 1 L5.5 3.5 L1 6" fill="none" stroke="#8A3A4C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="csOk" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#2C7A65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="330" rx="20" fill="url(#csbg)"/>

  <!-- ===== Left: stampede ===== -->
  <rect x="20" y="20" width="416" height="290" rx="16" fill="#0C1526" stroke="#213551"/>
  <circle cx="46" cy="52" r="7" fill="#FB7185"/>
  <text x="62" y="57" fill="#F1F5FB" font-size="14.5" font-weight="700">Без защиты · stampede</text>
  <text x="62" y="76" fill="#C87684" font-size="12">TTL истёк, кэш пуст в один тик</text>

  <!-- requests -->
  <g fill="#4F8DFB">
    <circle cx="70" cy="108" r="9"/><circle cx="118" cy="108" r="9"/><circle cx="166" cy="108" r="9"/>
    <circle cx="214" cy="108" r="9"/><circle cx="262" cy="108" r="9"/><circle cx="310" cy="108" r="9"/>
    <circle cx="358" cy="108" r="9"/>
  </g>
  <!-- arrows all to DB -->
  <g stroke="#8A3A4C" stroke-width="1.5">
    <line x1="70" y1="120" x2="150" y2="212" marker-end="url(#csErr)"/>
    <line x1="118" y1="120" x2="165" y2="212" marker-end="url(#csErr)"/>
    <line x1="166" y1="120" x2="185" y2="212" marker-end="url(#csErr)"/>
    <line x1="214" y1="120" x2="210" y2="212" marker-end="url(#csErr)"/>
    <line x1="262" y1="120" x2="235" y2="212" marker-end="url(#csErr)"/>
    <line x1="310" y1="120" x2="260" y2="212" marker-end="url(#csErr)"/>
    <line x1="358" y1="120" x2="285" y2="212" marker-end="url(#csErr)"/>
  </g>
  <!-- DB -->
  <rect x="60" y="214" width="316" height="56" rx="13" fill="#3A1620" stroke="#FB7185"/>
  <text x="218" y="240" fill="#FB7185" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="218" y="258" fill="#C87684" font-size="11.5" text-anchor="middle">180ms × сотни одинаковых запросов</text>
  <text x="218" y="294" fill="#8194B0" font-size="11.5" text-anchor="middle">все промахнулись → залп по базе → каскад</text>

  <!-- ===== Right: single-flight ===== -->
  <rect x="444" y="20" width="416" height="290" rx="16" fill="#0C1526" stroke="#213551"/>
  <circle cx="470" cy="52" r="7" fill="#34D399"/>
  <text x="486" y="57" fill="#F1F5FB" font-size="14.5" font-weight="700">Single-flight + jitter</text>
  <text x="486" y="76" fill="#6FBFA6" font-size="12">один вычисляет, остальные ждут</text>

  <!-- requests -->
  <g fill="#4F8DFB">
    <circle cx="494" cy="108" r="9"/><circle cx="542" cy="108" r="9"/><circle cx="590" cy="108" r="9"/>
    <circle cx="638" cy="108" r="9"/><circle cx="686" cy="108" r="9"/><circle cx="734" cy="108" r="9"/>
    <circle cx="782" cy="108" r="9"/>
  </g>
  <!-- coalesce bar -->
  <line x1="494" y1="120" x2="620" y2="150" stroke="#4A5B78" stroke-width="1.4"/>
  <line x1="542" y1="120" x2="628" y2="150" stroke="#4A5B78" stroke-width="1.4"/>
  <line x1="590" y1="120" x2="636" y2="150" stroke="#4A5B78" stroke-width="1.4"/>
  <line x1="638" y1="120" x2="644" y2="150" stroke="#4A5B78" stroke-width="1.4"/>
  <line x1="686" y1="120" x2="652" y2="150" stroke="#4A5B78" stroke-width="1.4"/>
  <line x1="734" y1="120" x2="660" y2="150" stroke="#4A5B78" stroke-width="1.4"/>
  <line x1="782" y1="120" x2="668" y2="150" stroke="#4A5B78" stroke-width="1.4"/>
  <rect x="512" y="150" width="280" height="34" rx="10" fill="#161231" stroke="#A78BFA"/>
  <text x="652" y="172" fill="#B49BFB" font-size="12.5" font-weight="700" text-anchor="middle">single-flight: один держит лок на ключе</text>
  <!-- one arrow to DB -->
  <line x1="652" y1="184" x2="652" y2="212" stroke="#2C7A65" stroke-width="1.8" marker-end="url(#csOk)"/>
  <rect x="492" y="214" width="320" height="56" rx="13" fill="#123D33" stroke="#34D399"/>
  <text x="652" y="240" fill="#5BE3AE" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="652" y="258" fill="#6FBFA6" font-size="11.5" text-anchor="middle">180ms × 1 запрос</text>
  <text x="652" y="294" fill="#8194B0" font-size="11.5" text-anchor="middle">база получает один запрос вместо сотен</text>
</svg>
