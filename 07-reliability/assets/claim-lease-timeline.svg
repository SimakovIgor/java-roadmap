<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="tlbg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="20" fill="url(#tlbg)"/>

  <!-- time axis -->
  <line x1="120" y1="250" x2="800" y2="250" stroke="#26324B" stroke-width="1.5"/>
  <g font-size="11.5" fill="#64758F" text-anchor="middle">
    <line x1="120" y1="246" x2="120" y2="254" stroke="#3A4B6B"/><text x="120" y="272">0s</text>
    <line x1="326" y1="246" x2="326" y2="254" stroke="#3A4B6B"/><text x="326" y="272">15s</text>
    <line x1="540" y1="246" x2="540" y2="254" stroke="#3A4B6B"/><text x="540" y="272">30s</text>
    <line x1="754" y1="246" x2="754" y2="254" stroke="#3A4B6B"/><text x="754" y="272">45s</text>
  </g>

  <!-- lease window -->
  <rect x="120" y="52" width="420" height="30" rx="8" fill="#241C08" stroke="#6E561A"/>
  <text x="330" y="72" fill="#F7C948" font-size="12.5" font-weight="600" text-anchor="middle">lease · claimed_until = 0s + 30s</text>
  <line x1="540" y1="52" x2="540" y2="250" stroke="#8A6D28" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="548" y="104" fill="#C9A64E" font-size="11.5">lease истёк</text>

  <!-- worker A -->
  <text x="40" y="128" fill="#7FA9FB" font-size="12.5" font-weight="700">Воркер A</text>
  <rect x="120" y="112" width="206" height="30" rx="8" fill="#12203B" stroke="#2E4C82"/>
  <text x="150" y="132" fill="#C9D8F0" font-size="12">захватил, обрабатывает</text>
  <text x="332" y="132" fill="#FB7185" font-size="16" font-weight="800">✗</text>
  <text x="350" y="132" fill="#C87684" font-size="11.5">упал на 15с</text>

  <!-- worker B -->
  <text x="40" y="188" fill="#B49BFB" font-size="12.5" font-weight="700">Воркер B</text>
  <rect x="540" y="172" width="214" height="30" rx="8" fill="#161231" stroke="#4A3E86"/>
  <text x="562" y="192" fill="#E0D8F6" font-size="12">переклаймил, обработал</text>
  <text x="762" y="192" fill="#34D399" font-size="15" font-weight="800">✓</text>

  <!-- reclaim arrow -->
  <path d="M540 158 C 528 152, 528 168, 540 172" stroke="#6C5F9E" stroke-width="1.4" fill="none"/>
  <text x="440" y="228" fill="#8194B0" font-size="12.5" text-anchor="middle">Никто не отпускал строку вручную. lease истёк по времени, и её забрал другой воркер</text>
</svg>
