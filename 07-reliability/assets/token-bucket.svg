<svg width="880" height="320" viewBox="0 0 880 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="tbbg" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="tba" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" rx="20" fill="url(#tbbg)"/>

  <!-- refill -->
  <text x="205" y="44" fill="#43D9A3" font-size="13" font-weight="600" text-anchor="middle">refill · 5 ток/с</text>
  <line x1="205" y1="54" x2="205" y2="92" stroke="#2C7A65" stroke-width="1.6" marker-end="url(#tba)"/>
  <circle cx="185" cy="76" r="3" fill="#34D399" opacity="0.7"/>
  <circle cx="225" cy="70" r="3" fill="#34D399" opacity="0.5"/>

  <!-- bucket -->
  <rect x="120" y="96" width="170" height="172" rx="16" fill="#0E1B33" stroke="#2E4C82"/>
  <g fill="#34D399">
    <circle cx="160" cy="140" r="9"/><circle cx="205" cy="140" r="9"/><circle cx="250" cy="140" r="9"/>
    <circle cx="160" cy="176" r="9"/><circle cx="205" cy="176" r="9"/><circle cx="250" cy="176" r="9"/>
    <circle cx="160" cy="212" r="9"/>
  </g>
  <text x="205" y="292" fill="#8FA1BF" font-size="12.5" text-anchor="middle">capacity 10 · допускает burst</text>

  <!-- bucket -> decision (consume) -->
  <path d="M290 176 H388" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#tba)"/>
  <text x="339" y="167" fill="#8194B0" font-size="11.5" text-anchor="middle">−1 токен</text>

  <!-- request -->
  <rect x="440" y="42" width="160" height="46" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="520" y="70" fill="#EAF1FB" font-size="14.5" font-weight="700" text-anchor="middle">Запрос</text>
  <line x1="520" y1="88" x2="520" y2="128" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#tba)"/>

  <!-- decision -->
  <rect x="390" y="130" width="220" height="50" rx="13" fill="#161B2E" stroke="#3A4B6B"/>
  <text x="500" y="160" fill="#DCE6F5" font-size="14.5" font-weight="700" text-anchor="middle">Есть свободный токен?</text>

  <!-- да -> allow -->
  <line x1="610" y1="150" x2="648" y2="150" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#tba)"/>
  <text x="629" y="141" fill="#6FBFA6" font-size="11.5" text-anchor="middle">да</text>
  <rect x="650" y="127" width="184" height="46" rx="13" fill="#123D33" stroke="#34D399"/>
  <text x="742" y="155" fill="#5BE3AE" font-size="14.5" font-weight="700" text-anchor="middle">200 · пропустить</text>

  <!-- нет -> deny -->
  <line x1="500" y1="180" x2="500" y2="212" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#tba)"/>
  <text x="514" y="202" fill="#C87684" font-size="11.5">нет</text>
  <rect x="408" y="214" width="204" height="46" rx="13" fill="#3A1620" stroke="#FB7185"/>
  <text x="510" y="242" fill="#FB7185" font-size="14.5" font-weight="700" text-anchor="middle">429 · Retry-After</text>
</svg>
