<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="msbg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="msa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="20" fill="url(#msbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">SPRING CLOUD: МИКРОСЕРВИСЫ</text>

  <!-- client -->
  <rect x="30" y="120" width="110" height="56" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="85" y="153" fill="#EAF1FB" font-size="14" font-weight="700" text-anchor="middle">Клиент</text>
  <line x1="140" y1="148" x2="166" y2="148" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#msa)"/>

  <!-- gateway -->
  <rect x="168" y="118" width="140" height="60" rx="13" fill="#161231" stroke="#A78BFA"/>
  <text x="238" y="146" fill="#B49BFB" font-size="14" font-weight="700" text-anchor="middle">API Gateway</text>
  <text x="238" y="164" fill="#8A7BC8" font-size="10.5" text-anchor="middle">роутинг, единая точка</text>

  <!-- services -->
  <g font-size="13" font-weight="700">
    <rect x="380" y="66" width="200" height="46" rx="12" fill="#0F3129" stroke="#34D399"/><text x="480" y="94" fill="#43D9A3" text-anchor="middle">order-service</text>
    <rect x="380" y="126" width="200" height="46" rx="12" fill="#0F3129" stroke="#34D399"/><text x="480" y="154" fill="#43D9A3" text-anchor="middle">payment-service</text>
    <rect x="380" y="186" width="200" height="46" rx="12" fill="#0F3129" stroke="#34D399"/><text x="480" y="214" fill="#43D9A3" text-anchor="middle">stock-service</text>
  </g>
  <g stroke="#5A6E8E" stroke-width="1.5">
    <path d="M308 138 C 340 110 350 92 378 90" fill="none" marker-end="url(#msa)"/>
    <path d="M308 148 C 350 149 360 150 378 150" fill="none" marker-end="url(#msa)"/>
    <path d="M308 158 C 340 186 350 206 378 210" fill="none" marker-end="url(#msa)"/>
  </g>

  <!-- infra -->
  <rect x="640" y="90" width="200" height="46" rx="12" fill="#12203B" stroke="#4F8DFB"/>
  <text x="740" y="112" fill="#7FA9FB" font-size="12.5" font-weight="700" text-anchor="middle">Service Discovery</text>
  <text x="740" y="128" fill="#9FB6DB" font-size="10" text-anchor="middle">Eureka: кто где живёт</text>
  <rect x="640" y="150" width="200" height="46" rx="12" fill="#12203B" stroke="#4F8DFB"/>
  <text x="740" y="172" fill="#7FA9FB" font-size="12.5" font-weight="700" text-anchor="middle">Config Server</text>
  <text x="740" y="188" fill="#9FB6DB" font-size="10" text-anchor="middle">общие настройки</text>
  <line x1="580" y1="112" x2="638" y2="112" stroke="#3A4B6B" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="580" y1="172" x2="638" y2="172" stroke="#3A4B6B" stroke-width="1.4" stroke-dasharray="4 4"/>

  <text x="440" y="278" fill="#8194B0" font-size="12" text-anchor="middle">каждый сервис независим, gateway маршрутизирует, discovery и config поддерживают инфраструктуру</text>
</svg>
