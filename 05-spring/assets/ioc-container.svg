<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="iocbg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="ioca" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#2C7A65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="20" fill="url(#iocbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">IoC-КОНТЕЙНЕР И ВНЕДРЕНИЕ ЗАВИСИМОСТЕЙ</text>

  <!-- container -->
  <rect x="30" y="62" width="820" height="180" rx="16" fill="#0C1526" stroke="#2E4C82" stroke-dasharray="7 5"/>
  <text x="52" y="88" fill="#7FA9FB" font-size="12.5" font-weight="700">ApplicationContext (контейнер)</text>

  <!-- OrderService (consumer) -->
  <rect x="60" y="108" width="220" height="110" rx="13" fill="#12203B" stroke="#4F8DFB"/>
  <text x="170" y="140" fill="#EAF1FB" font-size="15" font-weight="800" text-anchor="middle">OrderService</text>
  <line x1="60" y1="152" x2="280" y2="152" stroke="#2E4C82"/>
  <text x="82" y="178" fill="#9FB6DB" font-size="11.5" font-family="'JetBrains Mono',monospace">PaymentClient</text>
  <text x="82" y="200" fill="#9FB6DB" font-size="11.5" font-family="'JetBrains Mono',monospace">OrderRepository</text>

  <!-- injected beans -->
  <rect x="420" y="98" width="180" height="46" rx="12" fill="#0F3129" stroke="#34D399"/>
  <text x="510" y="126" fill="#43D9A3" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">PaymentClient</text>
  <rect x="420" y="152" width="180" height="46" rx="12" fill="#0F3129" stroke="#34D399"/>
  <text x="510" y="180" fill="#43D9A3" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">OrderRepository</text>
  <rect x="630" y="125" width="180" height="46" rx="12" fill="#0F3129" stroke="#34D399"/>
  <text x="720" y="153" fill="#43D9A3" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">EmailSender</text>

  <!-- inject arrows -->
  <path d="M418 121 C 360 130 320 160 282 172" stroke="#2C7A65" stroke-width="1.6" fill="none" marker-end="url(#ioca)"/>
  <path d="M418 175 C 360 182 320 184 282 185" stroke="#2C7A65" stroke-width="1.6" fill="none" marker-end="url(#ioca)"/>
  <text x="345" y="150" fill="#6FBFA6" font-size="11" text-anchor="middle">внедряет</text>

  <text x="440" y="272" fill="#8194B0" font-size="12.5" text-anchor="middle">ты не пишешь new: контейнер создаёт бины и сам передаёт их через конструктор</text>
</svg>
