<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="sbbg" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="sba" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="280" rx="20" fill="url(#sbbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">STARTER → АВТОКОНФИГУРАЦИЯ</text>

  <!-- starter -->
  <rect x="40" y="90" width="250" height="90" rx="14" fill="#12203B" stroke="#4F8DFB"/>
  <text x="165" y="126" fill="#EAF1FB" font-size="14" font-weight="700" text-anchor="middle">1 зависимость</text>
  <text x="165" y="150" fill="#7FA9FB" font-size="11.5" text-anchor="middle" font-family="'JetBrains Mono',monospace">starter-web</text>
  <line x1="290" y1="135" x2="340" y2="135" stroke="#5A6E8E" stroke-width="1.7" marker-end="url(#sba)"/>
  <text x="315" y="124" fill="#8FA1BF" font-size="10.5" text-anchor="middle">Boot</text>

  <!-- auto-configured beans -->
  <g font-family="'JetBrains Mono',monospace" font-size="12.5">
    <rect x="360" y="72" width="230" height="40" rx="11" fill="#0F3129" stroke="#34D399"/><text x="475" y="97" fill="#43D9A3" text-anchor="middle">встроенный Tomcat</text>
    <rect x="360" y="120" width="230" height="40" rx="11" fill="#0F3129" stroke="#34D399"/><text x="475" y="145" fill="#43D9A3" text-anchor="middle">DispatcherServlet</text>
    <rect x="360" y="168" width="230" height="40" rx="11" fill="#0F3129" stroke="#34D399"/><text x="475" y="193" fill="#43D9A3" text-anchor="middle">Jackson (JSON)</text>
    <rect x="610" y="96" width="230" height="40" rx="11" fill="#0F3129" stroke="#34D399"/><text x="725" y="121" fill="#43D9A3" text-anchor="middle">валидация, логгер</text>
    <rect x="610" y="144" width="230" height="40" rx="11" fill="#0F3129" stroke="#34D399"/><text x="725" y="169" fill="#43D9A3" text-anchor="middle">метрики, health</text>
  </g>

  <text x="440" y="248" fill="#8194B0" font-size="12.5" text-anchor="middle">Boot сам настраивает разумные умолчания, ты переопределяешь только нужное</text>
</svg>
