<svg width="880" height="320" viewBox="0 0 880 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="inbg" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="ina" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto">
      <path d="M3 3 L11 7 L3 11 Z" fill="#0C1730" stroke="#7FA9FB" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" rx="20" fill="url(#inbg)"/>

  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">НАСЛЕДОВАНИЕ И ПЕРЕОПРЕДЕЛЕНИЕ</text>
  <text x="40" y="60" fill="#64758F" font-size="12">потомок берёт поля и методы родителя, а sound() переопределяет по-своему</text>

  <!-- inheritance arrows (child -> parent bottom edge, hollow triangle) -->
  <path d="M230 210 C 250 168 320 152 384 150" stroke="#3A4B6B" stroke-width="1.6" fill="none" marker-end="url(#ina)"/>
  <path d="M650 210 C 630 168 560 152 496 150" stroke="#3A4B6B" stroke-width="1.6" fill="none" marker-end="url(#ina)"/>
  <text x="286" y="186" fill="#7FA9FB" font-size="11.5" font-family="'JetBrains Mono',monospace">extends</text>
  <text x="594" y="186" fill="#7FA9FB" font-size="11.5" font-family="'JetBrains Mono',monospace">extends</text>

  <!-- parent -->
  <rect x="330" y="76" width="220" height="86" rx="14" fill="#12203B" stroke="#2E4C82"/>
  <text x="440" y="106" fill="#EAF1FB" font-size="16" font-weight="800" text-anchor="middle">Animal</text>
  <line x1="330" y1="118" x2="550" y2="118" stroke="#2E4C82"/>
  <text x="352" y="144" fill="#C9D8F0" font-size="13" font-family="'JetBrains Mono',monospace">+ sound()</text>

  <!-- child Dog -->
  <rect x="110" y="214" width="240" height="90" rx="14" fill="#0F3129" stroke="#34D399"/>
  <text x="230" y="242" fill="#5BE3AE" font-size="15" font-weight="800" text-anchor="middle">Dog</text>
  <line x1="110" y1="254" x2="350" y2="254" stroke="#1E5C4C"/>
  <text x="132" y="280" fill="#E4F6EE" font-size="13" font-family="'JetBrains Mono',monospace">+ sound()</text>
  <text x="244" y="280" fill="#6FBFA6" font-size="12" font-family="'JetBrains Mono',monospace">→ «Гав»</text>

  <!-- child Cat -->
  <rect x="530" y="214" width="240" height="90" rx="14" fill="#161231" stroke="#A78BFA"/>
  <text x="650" y="242" fill="#B49BFB" font-size="15" font-weight="800" text-anchor="middle">Cat</text>
  <line x1="530" y1="254" x2="770" y2="254" stroke="#4A3E86"/>
  <text x="552" y="280" fill="#EDE9FB" font-size="13" font-family="'JetBrains Mono',monospace">+ sound()</text>
  <text x="664" y="280" fill="#B49BFB" font-size="12" font-family="'JetBrains Mono',monospace">→ «Мяу»</text>
</svg>
