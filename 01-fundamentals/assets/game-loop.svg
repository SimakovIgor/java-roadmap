<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="glbg" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="gla" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="280" rx="20" fill="url(#glbg)"/>

  <text x="40" y="44" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">ИГРОВОЙ ЦИКЛ</text>

  <!-- init -->
  <rect x="40" y="98" width="140" height="54" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="110" y="131" fill="#EAF1FB" font-size="14" font-weight="700" text-anchor="middle">Поле 3×3</text>
  <line x1="180" y1="125" x2="216" y2="125" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#gla)"/>

  <!-- turn -->
  <rect x="218" y="98" width="170" height="54" rx="13" fill="#161231" stroke="#4A3E86"/>
  <text x="303" y="123" fill="#B49BFB" font-size="14" font-weight="700" text-anchor="middle">Ход X / O</text>
  <text x="303" y="141" fill="#8A7BC8" font-size="10.5" text-anchor="middle">игрок, потом компьютер</text>
  <line x1="388" y1="125" x2="424" y2="125" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#gla)"/>

  <!-- check -->
  <rect x="426" y="94" width="160" height="62" rx="13" fill="#161B2E" stroke="#3A4B6B"/>
  <text x="506" y="130" fill="#DCE6F5" font-size="14" font-weight="700" text-anchor="middle">Победа / ничья?</text>

  <!-- loop back (нет) -->
  <path d="M506 94 C 506 44 303 44 303 96" stroke="#8A6D28" stroke-width="1.6" fill="none" marker-end="url(#gla)"/>
  <text x="404" y="40" fill="#C9A64E" font-size="11.5" text-anchor="middle">нет, следующий ход</text>

  <!-- да -> end -->
  <line x1="506" y1="156" x2="506" y2="188" stroke="#2C7A65" stroke-width="1.6" marker-end="url(#gla)"/>
  <text x="520" y="178" fill="#6FBFA6" font-size="11.5">да</text>
  <rect x="426" y="190" width="160" height="46" rx="13" fill="#0F3129" stroke="#34D399"/>
  <text x="506" y="219" fill="#5BE3AE" font-size="14" font-weight="700" text-anchor="middle">Конец игры</text>

  <!-- 3x3 board -->
  <rect x="672" y="70" width="150" height="150" rx="12" fill="#0E1B33" stroke="#24334D"/>
  <g stroke="#2A3B57" stroke-width="2">
    <line x1="722" y1="80" x2="722" y2="210"/>
    <line x1="772" y1="80" x2="772" y2="210"/>
    <line x1="682" y1="120" x2="812" y2="120"/>
    <line x1="682" y1="170" x2="812" y2="170"/>
  </g>
  <g font-size="26" font-weight="800" text-anchor="middle">
    <text x="697" y="113" fill="#34D399">X</text>
    <text x="797" y="113" fill="#4F8DFB">O</text>
    <text x="747" y="163" fill="#34D399">X</text>
    <text x="697" y="163" fill="#4F8DFB">O</text>
    <text x="797" y="213" fill="#34D399">X</text>
  </g>
</svg>
