<svg width="900" height="330" viewBox="0 0 900 330" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="habg" x1="0" y1="0" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="330" rx="20" fill="url(#habg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">АНАТОМИЯ ПЕРВОЙ ПРОГРАММЫ</text>

  <!-- code panel -->
  <rect x="34" y="64" width="470" height="230" rx="14" fill="#0C1526" stroke="#22345C"/>
  <g font-size="8" >
    <circle cx="54" cy="84" r="4" fill="#FB7185"/><circle cx="70" cy="84" r="4" fill="#FBBF24"/><circle cx="86" cy="84" r="4" fill="#34D399"/>
  </g>
  <g font-family="'JetBrains Mono',monospace" font-size="14.5">
    <text x="54" y="132" fill="#7FA9FB">public class <tspan fill="#F7C948">Main</tspan> {</text>
    <text x="78" y="168" fill="#7FA9FB">public static void <tspan fill="#5BE3AE">main</tspan>(<tspan fill="#B49BFB">String[]</tspan> args) {</text>
    <text x="102" y="204" fill="#C9D8F0">System.out.<tspan fill="#5BE3AE">println</tspan>(<tspan fill="#F0A868">"Hello, World!"</tspan>);</text>
    <text x="78" y="240" fill="#7FA9FB">}</text>
    <text x="54" y="276" fill="#7FA9FB">}</text>
  </g>
  <!-- number badges -->
  <g font-size="13" font-weight="800">
    <circle cx="486" cy="127" r="12" fill="#12203B" stroke="#4F8DFB"/><text x="486" y="132" fill="#7FA9FB" text-anchor="middle">1</text>
    <circle cx="486" cy="163" r="12" fill="#0F3129" stroke="#34D399"/><text x="486" y="168" fill="#43D9A3" text-anchor="middle">2</text>
    <circle cx="486" cy="199" r="12" fill="#241C08" stroke="#FBBF24"/><text x="486" y="204" fill="#F7C948" text-anchor="middle">3</text>
  </g>

  <!-- annotations -->
  <g>
    <line x1="500" y1="127" x2="540" y2="127" stroke="#4F8DFB" stroke-width="1.6"/>
    <rect x="542" y="102" width="326" height="50" rx="12" fill="#12203B" stroke="#2E4C82"/>
    <text x="560" y="124" fill="#EAF1FB" font-size="13" font-weight="700">Класс</text>
    <text x="560" y="142" fill="#9FB6DB" font-size="11.5">контейнер для кода, имя = имени файла Main.java</text>

    <line x1="500" y1="163" x2="540" y2="163" stroke="#34D399" stroke-width="1.6"/>
    <rect x="542" y="170" width="326" height="50" rx="12" fill="#0F3129" stroke="#2C7A65"/>
    <text x="560" y="192" fill="#E4F6EE" font-size="13" font-weight="700">Метод main</text>
    <text x="560" y="210" fill="#6FBFA6" font-size="11.5">точка входа: программа стартует отсюда</text>

    <line x1="500" y1="199" x2="540" y2="238" stroke="#FBBF24" stroke-width="1.6"/>
    <rect x="542" y="238" width="326" height="50" rx="12" fill="#241C08" stroke="#7A5E1E"/>
    <text x="560" y="260" fill="#F6EBC8" font-size="13" font-weight="700">Печать в консоль</text>
    <text x="560" y="278" fill="#C9A64E" font-size="11.5">println выводит строку и переносит курсор</text>
  </g>

  <text x="450" y="316" fill="#8194B0" font-size="12" text-anchor="middle">каждая программа на Java живёт внутри класса, а запускается с метода main</text>
</svg>
