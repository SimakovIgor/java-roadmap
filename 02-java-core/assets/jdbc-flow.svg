<svg width="880" height="270" viewBox="0 0 880 270" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="jdbg" x1="0" y1="0" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="jda" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="270" rx="20" fill="url(#jdbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">JDBC: ПУТЬ ОТ КОДА ДО БАЗЫ</text>

  <!-- app -->
  <rect x="30" y="96" width="130" height="60" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="95" y="131" fill="#EAF1FB" font-size="14" font-weight="700" text-anchor="middle">Приложение</text>
  <line x1="160" y1="126" x2="186" y2="126" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#jda)"/>

  <!-- connection -->
  <rect x="188" y="96" width="160" height="60" rx="13" fill="#0E1B33" stroke="#3A4B6B"/>
  <text x="268" y="122" fill="#DCE6F5" font-size="13" font-weight="700" text-anchor="middle">Connection</text>
  <text x="268" y="140" fill="#8FA1BF" font-size="10" text-anchor="middle" font-family="'JetBrains Mono',monospace">DriverManager</text>
  <line x1="348" y1="126" x2="374" y2="126" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#jda)"/>

  <!-- statement -->
  <rect x="376" y="96" width="180" height="60" rx="13" fill="#161231" stroke="#4A3E86"/>
  <text x="466" y="122" fill="#B49BFB" font-size="13" font-weight="700" text-anchor="middle">PreparedStatement</text>
  <text x="466" y="140" fill="#8A7BC8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono',monospace">execute()</text>
  <line x1="556" y1="126" x2="582" y2="126" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#jda)"/>

  <!-- resultset -->
  <rect x="584" y="96" width="140" height="60" rx="13" fill="#0F3129" stroke="#34D399"/>
  <text x="654" y="122" fill="#43D9A3" font-size="13" font-weight="700" text-anchor="middle">ResultSet</text>
  <text x="654" y="140" fill="#6FBFA6" font-size="10" text-anchor="middle" font-family="'JetBrains Mono',monospace">next()</text>

  <!-- database -->
  <g>
    <ellipse cx="815" cy="104" rx="35" ry="12" fill="#12203B" stroke="#4F8DFB"/>
    <path d="M780 104 V 150 A 35 12 0 0 0 850 150 V 104" fill="#12203B" stroke="#4F8DFB"/>
    <ellipse cx="815" cy="104" rx="35" ry="12" fill="#0E1B33" stroke="#4F8DFB"/>
    <text x="815" y="175" fill="#7FA9FB" font-size="12" font-weight="700" text-anchor="middle">БД</text>
  </g>
  <path d="M556 140 C 700 190 760 160 782 132" stroke="#5A6E8E" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#jda)"/>
  <path d="M780 130 C 740 150 700 150 656 146" stroke="#5A6E8E" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#jda)"/>

  <text x="440" y="240" fill="#64758F" font-size="11.5" text-anchor="middle">PreparedStatement с параметрами (?) защищает от SQL-инъекций · закрывай ресурсы через try-with-resources</text>
</svg>
