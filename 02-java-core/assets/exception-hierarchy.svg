<svg width="880" height="330" viewBox="0 0 880 330" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="ehbg" x1="0" y1="0" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="eha" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0C1730" stroke="#5A6E8E" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="330" rx="20" fill="url(#ehbg)"/>

  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">ИЕРАРХИЯ ИСКЛЮЧЕНИЙ</text>

  <!-- arrows (child -> parent) -->
  <path d="M205 128 C 240 100 300 84 356 80" stroke="#3A4B6B" stroke-width="1.6" fill="none" marker-end="url(#eha)"/>
  <path d="M645 128 C 610 100 550 84 494 80" stroke="#3A4B6B" stroke-width="1.6" fill="none" marker-end="url(#eha)"/>
  <path d="M645 238 V 190" stroke="#3A4B6B" stroke-width="1.6" fill="none" marker-end="url(#eha)"/>

  <!-- Throwable -->
  <rect x="356" y="54" width="140" height="50" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="426" y="84" fill="#EAF1FB" font-size="15" font-weight="800" text-anchor="middle">Throwable</text>

  <!-- Error -->
  <rect x="90" y="128" width="230" height="60" rx="13" fill="#2A0F17" stroke="#6E2C3B"/>
  <text x="112" y="154" fill="#FB7185" font-size="15" font-weight="800">Error</text>
  <text x="112" y="175" fill="#C87684" font-size="11.5">OutOfMemoryError, StackOverflow</text>

  <!-- Exception -->
  <rect x="520" y="128" width="250" height="60" rx="13" fill="#12203B" stroke="#4F8DFB"/>
  <text x="542" y="154" fill="#7FA9FB" font-size="15" font-weight="800">Exception</text>
  <text x="542" y="175" fill="#9FB6DB" font-size="11.5">IOException, SQLException</text>

  <!-- RuntimeException -->
  <rect x="520" y="238" width="250" height="60" rx="13" fill="#241C08" stroke="#FBBF24"/>
  <text x="542" y="264" fill="#F7C948" font-size="14.5" font-weight="800">RuntimeException</text>
  <text x="542" y="285" fill="#C9A64E" font-size="11.5">NPE, IndexOutOfBounds, IllegalArgument</text>

  <!-- legend -->
  <g font-size="12">
    <circle cx="100" cy="230" r="6" fill="#4F8DFB"/>
    <text x="114" y="234" fill="#C9D8F0">Exception (checked): компилятор требует обработать</text>
    <circle cx="100" cy="258" r="6" fill="#FBBF24"/>
    <text x="114" y="262" fill="#C9D8F0">RuntimeException (unchecked): ловить по желанию</text>
    <circle cx="100" cy="286" r="6" fill="#FB7185"/>
    <text x="114" y="290" fill="#C9D8F0">Error: системные сбои, обычно не ловим</text>
  </g>
</svg>
