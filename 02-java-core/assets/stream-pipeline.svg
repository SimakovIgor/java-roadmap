<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="spbg" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <marker id="spa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5A6E8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="280" rx="20" fill="url(#spbg)"/>
  <text x="40" y="40" fill="#8FA1BF" font-size="12.5" font-weight="700" letter-spacing="1.5">STREAM-КОНВЕЙЕР</text>

  <!-- group labels -->
  <text x="278" y="92" fill="#B49BFB" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="middle">ПРОМЕЖУТОЧНЫЕ · ЛЕНИВЫЕ</text>
  <text x="606" y="92" fill="#43D9A3" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="middle">ТЕРМИНАЛЬНАЯ · ЗАПУСКАЕТ</text>

  <!-- source -->
  <rect x="24" y="108" width="140" height="58" rx="13" fill="#12203B" stroke="#2E4C82"/>
  <text x="94" y="134" fill="#EAF1FB" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">[1,2,3,4,5]</text>
  <text x="94" y="153" fill="#7FA9FB" font-size="10.5" text-anchor="middle">источник</text>
  <line x1="164" y1="137" x2="192" y2="137" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#spa)"/>

  <!-- filter -->
  <rect x="194" y="108" width="150" height="58" rx="13" fill="#161231" stroke="#A78BFA"/>
  <text x="269" y="132" fill="#B49BFB" font-size="12.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">filter(чёт)</text>
  <text x="269" y="152" fill="#8A7BC8" font-size="10.5" text-anchor="middle">→ [2,4]</text>
  <line x1="344" y1="137" x2="372" y2="137" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#spa)"/>

  <!-- map -->
  <rect x="374" y="108" width="150" height="58" rx="13" fill="#161231" stroke="#A78BFA"/>
  <text x="449" y="132" fill="#B49BFB" font-size="12.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">map(×10)</text>
  <text x="449" y="152" fill="#8A7BC8" font-size="10.5" text-anchor="middle">→ [20,40]</text>
  <line x1="524" y1="137" x2="552" y2="137" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#spa)"/>

  <!-- collect -->
  <rect x="554" y="108" width="150" height="58" rx="13" fill="#0F3129" stroke="#34D399"/>
  <text x="629" y="132" fill="#43D9A3" font-size="12.5" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">collect()</text>
  <text x="629" y="152" fill="#6FBFA6" font-size="10.5" text-anchor="middle">toList</text>
  <line x1="704" y1="137" x2="732" y2="137" stroke="#5A6E8E" stroke-width="1.6" marker-end="url(#spa)"/>

  <!-- result -->
  <rect x="734" y="108" width="120" height="58" rx="13" fill="#123D33" stroke="#34D399"/>
  <text x="794" y="142" fill="#5BE3AE" font-size="13" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono',monospace">[20,40]</text>

  <text x="440" y="222" fill="#8194B0" font-size="12.5" text-anchor="middle">цепочка не выполняется, пока не вызвана терминальная операция</text>
</svg>
